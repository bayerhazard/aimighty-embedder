apiVersion: apps/v1
kind: Deployment
metadata:
  name: aimembqwen3vino
  namespace: {{ .Release.Namespace }}
  labels:
    app: aimembqwen3vino
    applications.app.bytetrade.io/name: aimembqwen3vino
    io.kompose.service: aimembqwen3vino
spec:
  # cluster mode -> 2 replicas spread across nodes (1 worker each),
  # single mode -> .Values.workloads.aimembqwen3vino.replicaCount (1)
  replicas: {{ if eq (default "cluster" .Values.olaresEnv.EMBEDDER_MODE) "cluster" }}{{ mul .Values.workloads.aimembqwen3vino.replicaCount 2 | int }}{{ else }}{{ .Values.workloads.aimembqwen3vino.replicaCount }}{{ end }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      app: aimembqwen3vino
  strategy:
    type: {{ .Values.strategy.type }}
    {{- if .Values.strategy.rollingUpdate }}
    rollingUpdate:
      maxSurge: {{ .Values.strategy.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.strategy.rollingUpdate.maxUnavailable }}
    {{- end }}
  template:
    metadata:
      labels:
        app: aimembqwen3vino
        applications.app.bytetrade.io/name: aimembqwen3vino
        applications.app.bytetrade.io/raw-app-name: aimembqwen3vino
        io.bytetrade.app: "true"
        io.kompose.service: aimembqwen3vino
    spec:
      initContainers:
      # check-auth must not wait on authelia (HTTP 400 -> CrashLoop). command:["true"]
      # makes the webhook-injected wait-for harmless even when it overwrites args.
      - name: check-auth
        image: beclab/wait-for:0.1.0
        imagePullPolicy: IfNotPresent
        command: ["true"]
        args: ["-it", "authelia-backend.user-system-aimighty:9091"]
      - name: render-envoy-config
        image: beclab/busybox:1.28
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          while [ ! -f /var/run/secrets/kubernetes.io/serviceaccount/token ]; do sleep 0.2; done
          TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          awk -v token="$TOKEN" '{gsub(/__SA_TOKEN__/, token); print}' /work/envoy.yaml > /config/envoy.yaml
          awk -v token="$TOKEN" '{gsub(/__SA_TOKEN__/, token); print}' /work/envoy2.yaml > /config/envoy2.yaml
          cat /config/envoy2.yaml
        volumeMounts:
        - mountPath: /config
          name: envoy-config
        - mountPath: /work/envoy.yaml
          name: olares-sidecar-config
          subPath: envoy.yaml
        - mountPath: /work/envoy2.yaml
          name: olares-sidecar-config
          subPath: envoy2.yaml
      - name: olares-sidecar-init
        image: beclab/init:v1.2.3
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh"]
        resources:
          limits:
            nvidia.com/gpu: "0"
          requests:
            nvidia.com/gpu: "0"
      # kubelet / health checks + Model Console must reach llm-init :8090 through
      # the envoy inbound redirect (same fix the reranker uses).
      - name: fix-kubelet-bypass
        image: beclab/init:v1.2.3
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          iptables -t nat -N PROXY_INBOUND 2>/dev/null || true
          for cidr in {{ join " " .Values.kubeletCidrs }}; do
            iptables -t nat -I PROXY_INBOUND 1 -s "$cidr" -j RETURN
          done
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
            - NET_RAW
        resources: {}
      # llm-init runs as UID 1000 and must own its shared cache + run dirs.
      - name: init-chown
        image: docker.io/beclab/aboveos-busybox:1.37.0
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - "mkdir -p /cache/hf/hub/.locks /run/llm-init && chown -R 1000:1000 /cache/hf/hub /run/llm-init || true"
        volumeMounts:
        - name: llm-init-cache
          mountPath: /cache/hf/hub
        - name: llm-init-run
          mountPath: /run/llm-init
        securityContext:
          runAsUser: 0
        resources: {}
      {{- if or (eq (.Values.olaresEnv.EMBEDDER_MODE | default "cluster") "cluster") (eq .Values.olaresEnv.EMBEDDER_MODE "Cluster_Mode") }}
      # cluster mode: spread pods across both nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: aimembqwen3vino
                topologyKey: kubernetes.io/hostname
      {{- else }}
      # single mode: run on any node
      {{- end }}
      containers:
        - name: embedder
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {}
          ports:
            - containerPort: {{ .Values.containerPort }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.env }}
            {{- if ne $value "" }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- range $key, $value := .Values.olaresEnv }}
            {{- if ne $value "" }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: app-envoy-config
              mountPath: /etc/envoy-config
              readOnly: true
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
        - name: olares-envoy-sidecar
          image: beclab/envoy:v1.25.11.1
          imagePullPolicy: IfNotPresent
          args: ["--log-level", "debug", "-c", "/config/envoy.yaml", "--service-cluster", "default."]
          env:
          - name: POD_UID
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: metadata.uid
          - name: POD_NAME
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: metadata.name
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: metadata.namespace
          - name: POD_IP
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: status.podIP
          - name: SERVICE_ACCOUNT
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: spec.serviceAccountName
          - name: APP_KEY
          - name: APP_SECRET
          ports:
          - name: proxy-admin
            containerPort: 15000
            protocol: TCP
          - name: proxy-inbound
            containerPort: 15003
            protocol: TCP
          - name: proxy-outbound
            containerPort: 15001
            protocol: TCP
          - name: liveness-port
            containerPort: 15008
            protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add: ["NET_ADMIN"]
            runAsUser: 1555
          volumeMounts:
          - mountPath: /config
            name: envoy-config
        # Model Console front proxy (Engine untouched): exposes /api/model-spec +
        # OpenAI /v1/models,/v1/embeddings; reverse-proxies to the embedder on 9997.
        - name: llm-init
          image: "{{ .Values.llmInit.image }}"
          imagePullPolicy: IfNotPresent
          env:
          - name: ENGINE_KIND
            value: "embed"
          - name: LLM_INIT_TEST_ENGINE_URL
            value: "{{ .Values.llmInit.engineUrl }}"
          - name: MODEL_NAME
            value: "{{ .Values.llmInit.modelName }}"
          - name: MODEL_MODE
            value: "embedding"
          - name: MODEL_SUPPORTS
            value: ""
          - name: MODEL_SOURCE
            value: "{{ .Values.llmInit.modelSource }}"
          - name: HF_HOME
            value: /cache/hf
          - name: HF_HUB_CACHE
            value: /cache/hf/hub
          - name: HUGGINGFACE_HUB_CACHE
            value: /cache/hf/hub
          {{- if .Values.olaresEnv.HF_ENDPOINT }}
          - name: HF_ENDPOINT
            value: "{{ .Values.olaresEnv.HF_ENDPOINT }}"
          {{- end }}
          {{- if .Values.olaresEnv.HF_TOKEN }}
          - name: HF_TOKEN
            value: "{{ .Values.olaresEnv.HF_TOKEN }}"
          {{- end }}
          - name: RUN_DIR
            value: /run/llm-init
          - name: PORT
            value: "{{ .Values.llmInit.port }}"
          - name: LOG_LEVEL
            value: "info"
          ports:
          - containerPort: {{ .Values.llmInit.port }}
          readinessProbe:
            httpGet:
              path: /livez
              port: {{ .Values.llmInit.port }}
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: {{ .Values.llmInit.port }}
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 4Gi
          volumeMounts:
          - name: llm-init-cache
            mountPath: /cache/hf/hub
          - name: llm-init-run
            mountPath: /run/llm-init
      volumes:
        - name: app-envoy-config
          emptyDir: {}
        - name: envoy-config
          emptyDir: {}
        - name: olares-sidecar-config
          configMap:
            name: olares-sidecar-config-{{ include "aimembqwen3vino.fullname" . }}
            defaultMode: 420
        - name: llm-init-cache
          hostPath:
            path: "{{ .Values.userspace.appCommon }}/huggingface"
            type: DirectoryOrCreate
        - name: llm-init-run
          hostPath:
            path: "{{ .Values.userspace.appCache }}/llm-init-run/aimembqwen3vino"
            type: DirectoryOrCreate

---
olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  aimembqwen3vino: 1

metadata:
  name: aimembqwen3vino
  icon: https://raw.githubusercontent.com/bayerhazard/aimighty-embedder/main/icon.png
  description: Qwen3-Embedding-4B via OpenVINO on CPU — batched throughput, instruction support, Matryoshka dims
  appid: aimembqwen3vino
  title: AIM Qwen3 4B Embedding
  version: '26.10.3'
  categories:
    - AI
sharedEntrances:
  - name: aimembqwen3vino
    host: sharedentrances-api
    port: 0
    title: AIM Qwen3 4B Embedding
    invisible: true
    authLevel: internal
    icon: https://raw.githubusercontent.com/bayerhazard/aimighty-embedder/main/icon.png
entrances:
  - name: aimembqwen3vino
    port: 8090
    host: download-svc
    title: AIM Qwen3 4B Embedding
    icon: https://raw.githubusercontent.com/bayerhazard/aimighty-embedder/main/icon.png
    openMethod: window
    authLevel: internal
spec:
  versionName: '26.10.3'
  onlyAdmin: true
  upgradeDescription: |
    v26.10.3: CPU request right-sized (requiredCpu 2 -> 1500m; measured load peak 4.3 cores on one replica, limit unchanged) to fit the worker node CPU-request budget. No behavior change. Built for Olares 1.12.7.
    v26.10.2: Olares Router integration (llm-init embed proxy). Recreate update strategy (hostPath cache volumes require it; RollingUpdate is rejected by the app-service). A beclab/llm-init sidecar now fronts the app (ENGINE_KIND=embed, MODEL_MODE=embedding) and exposes the Model Console contract (/api/model-spec on the shared entrance), so Router auto-registers the model and fills default-embedding. The OpenVINO inference engine on :9997 is untouched; llm-init only reverse-proxies the OpenAI /v1/models + /v1/embeddings contract to it. Model source moved to shared (`shared: true`), so this is an uninstall + install, not an in-place upgrade. Built for Olares 1.12.7.
  fullDescription: |
    Qwen3-Embedding-4B + OpenVINO on CPU, optimized for Olares One.

    **Model**
    Qwen/Qwen3-Embedding-4B — a 4-billion-parameter embedding model from Qwen, INT8 quantized via Optimum Intel for efficient inference on consumer hardware.

    **Inference Engine**
    OpenVINO 2026.2.1 + optimum-intel 2.0.0 + Hugging Face Transformers 4.55.4 (gepinnt, reproduzierbar). Runs on Intel Core Ultra iGPU (Arrow Lake-S) with automatic CPU fallback if the GPU is unavailable.

    **Key Features**
    - OpenAI-compatible API endpoints: /v1/embeddings, /v1/models, /health
    - THROUGHPUT mode with batched inference (concurrent requests are coalesced into one forward pass)
    - Cluster mode (EMBEDDER_MODE=cluster): 2 replicas spread across nodes via pod anti-affinity — uses both node CPUs
    - Optional query-side instruction (Qwen instruct format) for better retrieval quality
    - Optional Matryoshka dimension reduction (EMBED_DIM 32..2560)
    - Async endpoints with race-condition protection for concurrent RAG workloads
    - Built-in HTML dashboard on root endpoint (/)
    - Olares Router: registered as a local embedding model via Model Console auto-detection (fills default-embedding) — OpenAI-compatible /v1/embeddings through the Router gateway

    **Resource Usage**
    Single mode: ~24 GB RAM, 2 CPU cores
    Cluster mode: ~48 GB RAM, 4 CPU cores (2 nodes)
    Disk: 50 GB for model cache

  developer: Aimighty
  website: https://github.com/bayerhazard/aimighty-embedder
  sourceCode: https://github.com/bayerhazard/aimighty-embedder
  locale:
    - en-US
  supportArch:
    - amd64
  limitedCpu: 4
  requiredCpu: "1500m"
  requiredMemory: 24Gi
  limitedMemory: 24Gi
  requiredDisk: 50Gi
permission:
  appData: true
  appCache: true
  appCommon: true
options:
  apiTimeout: 3600
  LLMGatewaySupported: true
  shared: true
  templateOnly: false
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
  allowMultipleInstall: false
envs:
  - envName: HF_ENDPOINT
    required: false
    applyOnChange: false
    valueFrom:
      envName: OLARES_SYSTEM_HUGGINGFACE_ENDPOINT
  - envName: HF_TOKEN
    required: false
    applyOnChange: false
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_TOKEN
  - envName: EMBEDDER_MODE
    required: false
    default: "cluster"
    type: string
    editable: true
    applyOnChange: true
    description: "Deployment mode: 'cluster' = 2 pods across nodes (~48GB RAM), 'single' = 1 pod (~24GB RAM)"
    options:
      - title: Cluster mode (2 pods, ~48GB RAM)
        value: "cluster"
      - title: Single node (1 pod, ~24GB RAM)
        value: "single"
  - envName: OV_DEVICE
    required: false
    default: "CPU"
    type: string
    editable: true
    applyOnChange: true
    description: "OpenVINO inference device"
    options:
      - title: CPU (recommended)
        value: "CPU"
      - title: iGPU (requires compatible driver)
        value: "GPU"
  - envName: PERFORMANCE_HINT
    required: false
    default: "THROUGHPUT"
    type: string
    editable: true
    applyOnChange: true
    description: "OpenVINO performance optimization mode"
    options:
      - title: THROUGHPUT (maximize requests/sec)
        value: "THROUGHPUT"
      - title: LATENCY (minimize response time)
        value: "LATENCY"
  - envName: NUM_STREAMS
    required: false
    default: "1"
    type: int
    editable: true
    applyOnChange: true
    description: "Number of parallel inference streams (1 recommended — batching handles concurrency)"
  - envName: INFERENCE_THREADS
    required: false
    default: "8"
    type: int
    editable: true
    applyOnChange: true
    description: "OpenVINO CPU inference threads (P-cores on Core Ultra)"
  - envName: CPU_PINNING
    required: false
    default: "YES"
    type: string
    editable: true
    applyOnChange: true
    description: "Pin inference to CPU cores (deterministic scheduling; nice 10 already yields priority)"
    options:
      - title: YES (deterministic)
        value: "YES"
      - title: NO (free scheduling)
        value: "NO"
  - envName: MAX_LENGTH
    required: false
    default: "8192"
    type: int
    editable: true
    applyOnChange: true
    description: "Max tokens per input text (model supports up to 32768)"
  - envName: EMBED_DIM
    required: false
    default: "0"
    type: int
    editable: true
    applyOnChange: true
    description: "Output embedding dimension; 0 = full (2560), 32..2560 = Matryoshka (MRL) slice"
  - envName: DEFAULT_INSTRUCTION
    required: false
    default: ""
    type: string
    editable: true
    applyOnChange: true
    description: "Optional query-side task instruction, e.g. 'Given a web search query, retrieve relevant passages that answer the query' (per-request 'instruction' field overrides)"
  - envName: BATCH_WINDOW_MS
    required: false
    default: "5"
    type: int
    editable: true
    applyOnChange: true
    description: "Coalescing window (ms) for concurrent requests — larger = more batching, higher latency"
  - envName: INFER_TIMEOUT_SEC
    required: false
    default: "300"
    type: int
    editable: true
    applyOnChange: true
    description: "Per-request inference timeout in seconds"
  - envName: MODEL_NAME
    required: false
    default: "aimighty-embedding-4b"
    type: string
    editable: true
    applyOnChange: true
    description: "Model name exposed in the OpenAI-compatible API"
